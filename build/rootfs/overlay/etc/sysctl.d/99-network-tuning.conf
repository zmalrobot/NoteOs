# NoteOS — Disable IPv6 on Wi-Fi to eliminate routing blackholes and AAAA latency
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 0

# Enable automatic Path MTU discovery probing to prevent stalls on mobile hotspots and DSL
net.ipv4.tcp_mtu_probing = 1

