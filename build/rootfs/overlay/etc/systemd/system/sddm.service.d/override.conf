[Unit]
Description=NoteOS SDDM Hardware & Plymouth Synchronization
Wants=plymouth-quit.service plymouth-quit-wait.service
After=plymouth-quit.service plymouth-quit-wait.service

[Service]
Environment="QT_QUICK_BACKEND=software"
StandardOutput=file:/var/log/sddm.log
StandardError=file:/var/log/sddm.log

