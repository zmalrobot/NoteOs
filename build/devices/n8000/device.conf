# Configurazione Hardware e Build per Samsung Galaxy Note 10.1 3G (GT-N8000)
# Progetto: NoteOS (noteos-n8000)

DISTRO_NAME="NoteOS"
DISTRO_ID="noteos"
DISTRO_VERSION="1.0"
DEVICE_CODENAME="n8000"
DEVICE_NAME="Samsung Galaxy Note 10.1 3G (GT-N8000 / p4noterf)"
DEVICE_SOC="samsung,exynos4412"
DEVICE_ARCH="armhf"
DEVICE_CPU_ARCH="ARMv7-A Cortex-A9 Quad-Core (VFPv3 + NEON)"
DEVICE_RAM_MB=2048
DEVICE_DISPLAY_RES="1280x800"
DEVICE_GPU="ARM Mali-400 MP4 (Mesa Lima OpenGL 2.1 / ES 2.0)"

# Versione Kernel Mainline fissata per riproducibilita
KERNEL_VERSION="6.6.158"
KERNEL_TARBALL_URL="https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.158.tar.xz"
KERNEL_TARBALL_SHA256="9eb33173b0e04e898d431587c78c47ee6e19e3fdf2ea007323de82af14bb2a4f"
KERNEL_DEFCONFIG="exynos_defconfig"
KERNEL_DTB="samsung/exynos4412-p4note-n8000.dtb"

# Partizione BOOT (Kernel + Initramfs integrato)
BOOT_PART_NAME="BOOT"
BOOT_PART_DEV="/dev/block/mmcblk0p5"
BOOT_PART_BYNAME="/dev/block/platform/dw_mmc/by-name/BOOT"
BOOT_PART_START_SECTOR=81920
BOOT_PART_SIZE_SECTORS=16384
BOOT_PART_PHYSICAL_BYTES=8388608
BOOT_IMAGE_MAX_BYTES=7864320          # Limite rigido: 7,5 MiB (7.864.320 byte)

# Partizione RECOVERY (TWRP 3.7.0_9-0 - MAI TOCCARE)
RECOVERY_PART_NAME="RECOVERY"
RECOVERY_PART_DEV="/dev/block/mmcblk0p6"
RECOVERY_PART_BYNAME="/dev/block/platform/dw_mmc/by-name/RECOVERY"
RECOVERY_PART_START_SECTOR=98304
RECOVERY_PART_SIZE_SECTORS=16384

# Partizione Rootfs Linux (dopo ripartizionamento manuale: unione ex p8..p12)
ROOTFS_PART_NAME="USERDATA"
ROOTFS_PART_DEV="/dev/block/mmcblk0p8"
ROOTFS_PART_LINUX_DEV="/dev/mmcblk0p8"
ROOTFS_PART_BYNAME="/dev/block/platform/dw_mmc/by-name/USERDATA"
ROOTFS_PART_START_SECTOR=180224
ROOTFS_PART_SIZE_SECTORS=30588928     # 15.661.531.136 byte (~14,59 GiB)
ROOTFS_FSTYPE="ext4"
ROOTFS_LABEL="debian_root"

# Layout partizioni atteso e originale (con SHA256 verificati)
LAYOUT_ORIGINAL_FILE="devices/n8000/partition-layout-original.sfdisk"
LAYOUT_ORIGINAL_SHA256="167001a3399e5a69a27de17170279ba29486c36c22a399eb17eb0ae1ce4c6baa"
LAYOUT_CURRENT_FILE="devices/n8000/partition-layout-current.sfdisk"
LAYOUT_CURRENT_SHA256="4df76f1d06b2c49ded89f8c262d3586c5a072a6c44b746e1b759e708a78c562f"

# Parametri mkbootimg (Android Boot Image Header v0 per Samsung S-BOOT)
MKBOOTIMG_HEADER_VERSION=0
MKBOOTIMG_BASE="0x40000000"
MKBOOTIMG_PAGESIZE=2048
MKBOOTIMG_KERNEL_OFFSET="0x00008000"
MKBOOTIMG_RAMDISK_OFFSET="0x01000000"
MKBOOTIMG_SECOND_OFFSET="0x00f00000"
MKBOOTIMG_TAGS_OFFSET="0x00000100"

# Command line del kernel (Release vs Debug)
# Release: nessuna console seriale attiva, nessun debug=1, splash grafico Plymouth silenzioso
CMDLINE_RELEASE="console=tty0 consoleblank=0 root=LABEL=debian_root rootfstype=ext4 rw rootwait quiet splash loglevel=0 vt.global_cursor_default=0 systemd.show_status=false"
CMDLINE_DEBUG="console=tty0 console=ttySAC2,115200 earlyprintk root=LABEL=debian_root rootfstype=ext4 rw rootwait debug=1"

# Metodo di flash da TWRP via ADB
FLASH_METHOD="twrp-adb-dd"

# Lista Firmware richiesti e relativa origine (estratti da rootfs/extract-firmware.sh, MAI committati)
# 1. brcm/brcmfmac4334-sdio.bin              -> Pacchetto Debian non-free-firmware: firmware-brcm80211
# 2. brcm/brcmfmac4334-sdio.txt              -> Estratto da ./backup/system.img (/etc/wifi/nvram_net.txt) + MAC da ./backup/efs.img
# 3. brcm/brcmfmac4334-sdio.samsung,n8000.txt-> Copia device-specific di brcmfmac4334-sdio.txt
# 4. brcm/BCM4334B0.hcd                      -> Estratto da ./backup/system.img (/vendor/firmware/bcm4334.hcd)
FIRMWARE_LIST="brcm/brcmfmac4334-sdio.bin brcm/brcmfmac4334-sdio.txt brcm/brcmfmac4334-sdio.samsung,n8000.txt brcm/BCM4334B0.hcd"
