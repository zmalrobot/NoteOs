# Template device.conf per aggiungere un nuovo dispositivo a NoteOS
# Copia questa cartella in devices/<codename>/ e compila tutti i campi.
# Consulta docs/NEW_DEVICE.md per i requisiti completi.

DEVICE_CODENAME="example_device"
DEVICE_NAME="Vendor Model Name (Codename)"
DEVICE_SOC="vendor,soc-name"
DEVICE_ARCH="armhf"                   # Nota: il rootfs attuale e' armhf (ARMv7 hard-float)
DEVICE_CPU_ARCH="ARMv7-A"
DEVICE_RAM_MB=2048
DEVICE_DISPLAY_RES="1280x800"
DEVICE_GPU="GPU Model (Driver)"

KERNEL_VERSION="6.6.158"
KERNEL_TARBALL_URL="https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.158.tar.xz"
KERNEL_TARBALL_SHA256="9eb33173b0e04e898d431587c78c47ee6e19e3fdf2ea007323de82af14bb2a4f"
KERNEL_DEFCONFIG="multi_v7_defconfig"
KERNEL_DTB="vendor/soc-board.dtb"

BOOT_PART_NAME="BOOT"
BOOT_PART_DEV="/dev/block/mmcblk0pX"
BOOT_PART_BYNAME="/dev/block/by-name/BOOT"
BOOT_PART_START_SECTOR=0
BOOT_PART_SIZE_SECTORS=16384
BOOT_PART_PHYSICAL_BYTES=8388608
BOOT_IMAGE_MAX_BYTES=7864320

RECOVERY_PART_NAME="RECOVERY"
RECOVERY_PART_DEV="/dev/block/mmcblk0pY"
RECOVERY_PART_BYNAME="/dev/block/by-name/RECOVERY"
RECOVERY_PART_START_SECTOR=0
RECOVERY_PART_SIZE_SECTORS=16384

ROOTFS_PART_NAME="USERDATA"
ROOTFS_PART_DEV="/dev/block/mmcblk0pZ"
ROOTFS_PART_LINUX_DEV="/dev/mmcblk0pZ"
ROOTFS_PART_BYNAME="/dev/block/by-name/USERDATA"
ROOTFS_PART_START_SECTOR=0
ROOTFS_PART_SIZE_SECTORS=0
ROOTFS_FSTYPE="ext4"
ROOTFS_LABEL="debian_root"

LAYOUT_ORIGINAL_FILE="devices/example_device/partition-layout-original.sfdisk"
LAYOUT_ORIGINAL_SHA256=""
LAYOUT_CURRENT_FILE="devices/example_device/partition-layout-current.sfdisk"
LAYOUT_CURRENT_SHA256=""

MKBOOTIMG_HEADER_VERSION=0
MKBOOTIMG_BASE="0x40000000"
MKBOOTIMG_PAGESIZE=2048
MKBOOTIMG_KERNEL_OFFSET="0x00008000"
MKBOOTIMG_RAMDISK_OFFSET="0x01000000"
MKBOOTIMG_SECOND_OFFSET="0x00f00000"
MKBOOTIMG_TAGS_OFFSET="0x00000100"

CMDLINE_RELEASE="console=tty0 root=LABEL=debian_root rootfstype=ext4 rw rootwait quiet"
CMDLINE_DEBUG="console=tty0 earlyprintk root=LABEL=debian_root rootfstype=ext4 rw rootwait debug=1"

FLASH_METHOD="twrp-adb-dd"
FIRMWARE_LIST=""
